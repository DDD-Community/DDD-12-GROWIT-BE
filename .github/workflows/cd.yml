name: Deploy production backend to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: growit-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: growit-server
  LAMBDA_FUNCTION_NAME: growit-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build application JAR
        run: |
          chmod +x gradlew
          ./gradlew :app:bootJar
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009075573241:role/growit-github-backend-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Lambda image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" --push ./app
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Deploy image to Lambda
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" --image-uri "$IMAGE_URI"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"
      - name: Verify API
        run: curl --fail --retry 2 --retry-delay 5 "${{ vars.API_URL }}/actuator/health"
